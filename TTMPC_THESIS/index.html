<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA metadata (member portal). vite-plugin-pwa injects the manifest
         link automatically at build time; the tags below are the ones the
         plugin doesn't handle — iOS Safari specifics and theme color. -->
    <meta name="theme-color" content="#1D6021" />
    <!-- Modern standard, silences the Chrome deprecation warning. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Legacy iOS Safari — still required for older iOS versions that
         don't recognize the standard `mobile-web-app-capable` tag yet. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TTMPC" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>TTMPC Member Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
