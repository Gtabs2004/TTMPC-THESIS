  <script>
    (function () {
      const ringA = document.querySelector(".fr13-ring-a");
      const ringB = document.querySelector(".fr13-ring-b");
      const glowHalo = document.querySelector(".fr13-glow-halo");
      const confirmFlash = document.querySelector(".fr13-confirm-flash");
      const ringDrawWrap = document.querySelector(".fr13-ring-draw");
      const ringDrawCircle = document.querySelector(".fr13-ring-draw circle");
      const logo = document.querySelector(".fr13-logo");
      const accentRule = document.querySelector(".fr13-accent-rule");
      const words = document.querySelectorAll(".fr13-word");
      const sublineWrap = document.querySelector(".fr13-subline-wrap");
      const lockupGroup = document.querySelector(".fr13-lockup-group");

      // svg-path-draw setup — measured geometry, never guessed
      const ringLen = ringDrawCircle.getTotalLength();
      gsap.set(ringDrawCircle, { strokeDasharray: ringLen, strokeDashoffset: ringLen });

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-~0.4s) — clear / ignite: rings pulse from center, mark glow ignites
      tl.fromTo(ringA, { scale: 0.3, opacity: 0.32 }, { scale: 1.7, opacity: 0, duration: 0.85, ease: "power2.out" }, 0.0);
      tl.fromTo(ringB, { scale: 0.3, opacity: 0.22 }, { scale: 1.95, opacity: 0, duration: 0.95, ease: "power2.out" }, 0.12);
      tl.fromTo(glowHalo, { opacity: 0, scale: 0.6 }, { opacity: 0.26, scale: 1, duration: 0.4, ease: "power2.out" }, 0.0);
      tl.to(glowHalo, { opacity: 0.14, duration: 0.6, ease: "power1.out" }, 0.4);

      // Scene 2 (0.0-~1.1s) — assemble: the mark draws itself on (ring trace) while the mark blooms in

      tl.to(ringDrawWrap, { opacity: 0, duration: 0.4, ease: "power1.out" }, 0.65);
      tl.fromTo(logo, { scale: 0.74, opacity: 0, y: 8 }, { scale: 1, opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 0.0);
      tl.fromTo(confirmFlash, { opacity: 0, scale: 0.85 }, { opacity: 0.4, scale: 1.05, duration: 0.18, ease: "power1.out" }, 0.46);
      tl.to(confirmFlash, { opacity: 0, scale: 1.3, duration: 0.35, ease: "power1.in" }, 0.64);
      tl.fromTo(accentRule, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.78);

      // Scene 3 (~1.05-2.55s) — resolve to lockup: headline cascades word by word, subline wipes in

        tl.fromTo(w, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.05 + i * 0.11);
      });
      tl.fromTo(sublineWrap, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" }, 2.05);

      // Hold (2.65-5.0s) — final frame quiet settle: near-imperceptible life in the hold, no exit

      window.__timelines["13-brand-outro"] = tl;
      tl.seek(0);
