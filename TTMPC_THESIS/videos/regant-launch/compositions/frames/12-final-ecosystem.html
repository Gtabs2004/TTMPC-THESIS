<script>
(function () {
  var desktopEl  = document.getElementById("f12-desktop");
  var phoneEl    = document.getElementById("f12-phone");
  var liveDotEl  = document.getElementById("f12-live-dot");
  var glowEl     = document.getElementById("f12-phone-glow");

  var dEyebrow = document.getElementById("f12-d-eyebrow");
  var dTitle   = document.getElementById("f12-d-title");
  var dStats   = document.getElementById("f12-d-stats");
  var dChart   = document.getElementById("f12-d-chart");
  var pProfile = document.getElementById("f12-p-profile");
  var pMigs    = document.getElementById("f12-p-migs");
  var pNav     = document.getElementById("f12-p-nav");

  var tl = gsap.timeline({ paused: true });

  // ===================================================================
  // Scene 1 (0.0–0.5s) — the pair settles into frame at its angled rest
  // pose. Hero (both devices) fully visible by t<=0.5s.
  // ===================================================================
  var deskPose  = { s: 0.86, r: -9, ry: 12, tx: 26, ty: -14 };
  var deskRest  = { s: 1,    r: -3, ry: 4,  tx: 0,  ty: 0   };
  var phonePose = { s: 0.86, r: 9,  ry: -12, tx: -22, ty: -10 };
  var phoneRest = { s: 1,    r: 3,  ry: -4,  tx: 0,   ty: 0   };

  var deskDrift  = { x: 0, y: 0 };
  var phoneDrift = { x: 0, y: 0 };

  function paintDesktop() {
    if (!desktopEl) return;
    desktopEl.style.transform =
      "translate(" + (deskPose.tx + deskDrift.x) + "px," + (deskPose.ty + deskDrift.y) + "px) " +
      "rotate(" + deskPose.r + "deg) rotateY(" + deskPose.ry + "deg) scale(" + deskPose.s + ")";
  }
  function paintPhone() {
    if (!phoneEl) return;
    phoneEl.style.transform =
      "translate(" + (phonePose.tx + phoneDrift.x) + "px," + (phonePose.ty + phoneDrift.y) + "px) " +
      "rotate(" + phonePose.r + "deg) rotateY(" + phonePose.ry + "deg) scale(" + phonePose.s + ")";
  }

  // Pre-render the from-pose synchronously so a t=0 seek is correct
  // before the timeline ever plays (belt-and-braces alongside fromTo).
  paintDesktop();
  paintPhone();

  tl.fromTo(desktopEl, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.0)
    .to(deskPose, {
      s: deskRest.s, r: deskRest.r, ry: deskRest.ry, tx: deskRest.tx, ty: deskRest.ty,
      duration: 0.45, ease: "power3.out", onUpdate: paintDesktop
    }, 0.0);

  tl.fromTo(phoneEl, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.08)
    .to(phonePose, {
      s: phoneRest.s, r: phoneRest.r, ry: phoneRest.ry, tx: phoneRest.tx, ty: phoneRest.ty,
      duration: 0.42, ease: "power3.out", onUpdate: paintPhone
    }, 0.08);

  // ===================================================================
  // Scene 2 (~0.45–1.2s) — each device's content resolves in one quiet
  // staggered beat (spring-pop-entrance group form), not front-loaded
  // with the device shells themselves.
  // ===================================================================
  var DESKTOP_CONTENT_AT = 0.5;
  [dEyebrow, dTitle, dStats, dChart].forEach(function (el, i) {
    if (!el) return;
    tl.fromTo(el,
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      DESKTOP_CONTENT_AT + i * 0.08
    );
  });

  var PHONE_CONTENT_AT = 0.58;
  [pProfile, pMigs, pNav].forEach(function (el, i) {
    if (!el) return;
    tl.fromTo(el,
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      PHONE_CONTENT_AT + i * 0.08
    );
  });

  // Phone screen glow — blooms in sync with the phone's own settle
  // ("screen glowing"), then breathes gently through the hold.
  if (glowEl) {
    tl.fromTo(glowEl,
      { opacity: 0, scale: 0.82 },
      { opacity: 0.28, scale: 1, duration: 0.55, ease: "power2.out" },
      0.35
    );
  }

  // Live status dot on the desktop chrome bar — pops in right after the
  // window settles ("dashboard ticking").
  if (liveDotEl) {
    tl.fromTo(liveDotEl,
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
      0.5
    );
  }

  // ===================================================================
  // Scene 3 (~1.3–5.0s) — the calm hold. A slow shared drift parallaxes
  // the pair as one viewpoint; the phone carries a touch of independent
  // motion (closer object, slightly more travel); the live dot pulses
  // and the phone glow breathes — the only two "alive" cues. All three
  // idle channels taper to stillness over the final ~20% so the frame
  // is fully at rest before the crossfade into frame 13.
  // ===================================================================
  var IDLE_START = 1.3;
  var IDLE_END = 5.0;
  var IDLE_DUR = IDLE_END - IDLE_START;
  var FADE_FRAC = 0.22;

  function envelopeAt(tNorm) {
    return tNorm < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - tNorm) / FADE_FRAC);
  }

  var stageDrift = { p: 0 };
  var STAGE_CYCLES = 1;
  tl.to(stageDrift, {
    p: Math.PI * 2 * STAGE_CYCLES,
    duration: IDLE_DUR,
    ease: "none",
    onUpdate: function () {
      var tNorm = IDLE_DUR > 0 ? (stageDrift.p / (Math.PI * 2 * STAGE_CYCLES)) : 0;
      var env = envelopeAt(tNorm);
      var sx = Math.sin(stageDrift.p) * 2.4 * env;
      var sy = Math.sin(stageDrift.p * 1.3) * 1.3 * env;

      // shared background-pair drift
      deskDrift.x = sx;
      deskDrift.y = sy;
      // phone (foreground) carries a touch more independent travel,
      // offset in phase so the two never move in perfect lockstep
      phoneDrift.x = sx * 1.5 + Math.sin(stageDrift.p * 1.4 + Math.PI / 3) * 1.4 * env;
      phoneDrift.y = sy * 1.5 + Math.sin(stageDrift.p * 1.1 + Math.PI / 3) * 0.9 * env;

      paintDesktop();
      paintPhone();
    }
  }, IDLE_START);

  // Live dot — finite low-amplitude pulse (yoyo form; nothing else
  // touches this property).
  if (liveDotEl) {
    tl.to(liveDotEl, {
      scale: 1.22,
      duration: 0.55,
      ease: "sine.inOut",
      yoyo: true,
      repeat: 5
    }, 0.95);
  }

  // Phone glow — bounded breathe, tapering to a steady rest in the
  // final stretch (long-idle handling: half amplitude, settle-and-fade
  // tail).
  if (glowEl) {
    var glowPhase = { p: 0 };
    var GLOW_CYCLES = Math.max(1, Math.round(IDLE_DUR / 3));
    tl.to(glowPhase, {
      p: Math.PI * 2 * GLOW_CYCLES,
      duration: IDLE_DUR,
      ease: "none",
      onUpdate: function () {
        var tNorm = GLOW_CYCLES > 0 ? (glowPhase.p / (Math.PI * 2 * GLOW_CYCLES)) : 0;
        var env = envelopeAt(tNorm);
        var s = Math.sin(glowPhase.p);
        glowEl.style.opacity = String(0.28 + s * 0.05 * env);
        glowEl.style.transform = "scale(" + (1 + s * 0.025 * env) + ")";
      }
    }, IDLE_START);
  }

  window.__timelines = window.__timelines || {};
  window.__timelines["12-final-ecosystem"] = tl;
})();
</script>
